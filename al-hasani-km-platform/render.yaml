# Render — خدمة منفصلة (اختياري)
# الإنتاج الموحّد يستخدم render.yaml في جذر المستودع (سيرفر واحد cat).
# استخدم هذا الملف فقط إذا أردت نشر المنصّة على خدمة مستقلة.

services:
  - type: web
    name: alhasani-km-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: NEXT_PUBLIC_AUTH_PROVIDER
        value: supabase
      - key: NEXT_PUBLIC_DEMO_MODE
        value: false
      - key: NEXT_PUBLIC_SYSTEM_URL
        value: https://alhasani-home-center-cat.onrender.com
